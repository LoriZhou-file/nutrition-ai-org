# 30 天控糖自我管理：任务库（草案 v0.1）
#
# 状态：待营养师和医生审核。以下内容是项目组草拟，不是审核后的专业内容。
# 对应设计稿：30天自我管理任务库 初稿（2026-11-26）。
#
# 设计原则：
#   1. 每天只做一件小事，不要求节食，不要求记录数值。
#   2. 全部任务是“换、排序、规律、增加”，没有“少吃、跳餐、禁食、减药”。
#   3. 面向成年人，运动任务全员直接开启，不设前置确认。
#   4. 用药人群多一条提示（note_hypo / note_conservative）；用药或有特殊情况的人，入口各看一次提示页。
#   5. 每周日（第 7、14、21、28 天）出一次生活小结，第 30 天出 30 天总结。
#   6. 运动时长和动作是草稿，必须由医生和营养师审核。
#   7. kb_refs 指向 knowledge/ 下已有的知识单元；审核前不得对外宣称依据。
#
# 任务字段
#   kind               任务类别：diet 饮食、walk 餐后散步、resist 力量练习、aware 觉察、review 复盘、measure 数据
#   note_conservative  所有用药或不确定的人看到的提示
#   note_hypo          运动类任务上的低血糖提示，优先于 note_conservative 显示

_notes:
  med: &n_med 吃药和进餐安排听医生的，不要因为任务自己改动用药。
  hypo: &n_hypo 不要空腹运动，随身带含糖食物。出现心慌、手抖、出冷汗，立即停下，按医生教你的方法处理并联系医生。
  hypo_walk: &n_hypo_walk 不要空腹散步，随身带含糖食物，有不适立即停下。出现心慌、手抖、出冷汗，请按医生教你的方法处理并联系医生。

id: 30day-glycemic
version: "0.1"
status: pending_review
title: 30 天控糖自我管理
subtitle: 每天只做一件小事，饮食、餐后散步、力量练习一步一步加
common_footer: 不确定能不能做，先问你的医生或营养师。

weeks:
  - {week: 1, title: 起步，饮食和运动一起开始, days: [1, 7]}
  - {week: 2, title: 补齐饮食，巩固运动, days: [8, 14]}
  - {week: 3, title: 外食、饮酒和作息觉察, days: [15, 21]}
  - {week: 4, title: 整合与巩固, days: [22, 28]}

kind_labels:
  diet: 饮食
  walk: 餐后散步
  resist: 力量练习
  aware: 觉察
  review: 复盘

notices:
  hypo:
    title: 关于低血糖，请先了解
    text: 使用胰岛素、磺脲类或格列奈类药物时，饮食和运动的变化可能引起低血糖。常见表现有心慌、手抖、出冷汗、饥饿感、头晕。出现这些情况，请按医生交代的方式处理，并告诉医生。运动前不要空腹，随身带含糖食物。如果你不确定自己的药属于哪一类，也请按这个提示做，并看一下药盒或问医生。
    ack: 我已了解
  special:
    title: 特别提示
    text: 你的情况需要医生制定个体化的饮食和运动方案。本工具只提供一般性的生活方式小任务，不能替代医生的指导。任务与医嘱不一致时，以医嘱为准，可以随时跳过任务，出现不适请及时联系医生。
    ack: 我已了解

statuses:
  done: 做到了
  partial: 做了一部分
  skipped: 没做到

barriers:
  - {id: forgot, label: 忘了}
  - {id: no_time, label: 没时间}
  - {id: eating_out, label: 在外面吃，不方便}
  - {id: dislike, label: 不太想做}
  - {id: unwell, label: 今天身体不舒服}
  - {id: other, label: 其他}

barrier_tips:
  forgot: 可以把任务设成饭前的小提醒，或者记在手机便签里。
  no_time: 这件事不需要额外时间，下一顿饭就能顺手做。
  eating_out: 外面吃也能做，点餐时多选一份蔬菜类就行。
  dislike: 不想做也很正常。换成你觉得最容易的一种方式，做一点点就好。
  unwell: 身体不舒服的时候不用勉强。如果持续不舒服，请联系医生。
  other: 谢谢你告诉我们，这会帮助我们把方案设计得更贴近你。

feedback:
  done: 做到了，这就是最难的一步。
  partial: 做一部分也算数，开始了就比不做强。
  skipped: 没关系，一天没做到不影响整体。
  skipped_tail: 明天继续，或者之后找个时间补上。

tasks:
  # ---------------------------------------------------------------- 第 1 周
  - day: 1
    kind: aware
    title: 先看看，不用改
    task: 今天只做一件事：留意你吃了什么，不用改任何东西。
    why: 知道自己现在怎么吃，才知道从哪里改最省力。
    how: 睡前花一分钟回想今天的三餐和加餐，找出你觉得“最不控糖”的一餐。
    note_conservative: *n_med
    question:
      text: 哪一餐你觉得最不控糖？
      key: least_friendly_meal
      options: [早餐, 午餐, 晚餐, 加餐零食, 说不清]
    kb_refs: [KB00-009]
    done_msg: 先看清楚，后面就好改了。
    partial_msg: 想起来多少记多少就行。

  - day: 2
    kind: diet
    title: 先吃蔬菜
    task: 今天有一餐，先吃完一份蔬菜，再吃肉蛋，最后吃主食。
    why: 先蔬菜、再蛋白质、最后主食，是不改变总量的吃法，有助于让餐后血糖更平稳，也更容易饱。
    how: 选哪一餐都行，外卖也可以。吃饭时先把蔬菜吃完，再吃其他。
    note_conservative: *n_med
    question:
      text: 你选的是哪一餐？
      key: veg_first_meal
      options: [早餐, 午餐, 晚餐]
    kb_refs: [KB02-004, KB00-004]
    done_msg: 这个小习惯坚持下来，变化会慢慢出现。
    partial_msg: 吃了几口蔬菜先垫一下，也有帮助。

  - day: 3
    kind: walk
    title: 餐后散步试一试
    task: 今天选一餐，饭后慢走一会儿，能走多久走多久，目标大约 10 分钟。
    why: 饭后适度活动，有助于让餐后血糖更平稳，也是最容易开始的运动。
    how: 选最方便的一餐，饭后先休息一会儿，再慢慢走。不用快走，不用出汗。
    note_hypo: *n_hypo_walk
    question:
      text: 你选的是哪一餐后？
      key: walk_meal
      options: [早餐后, 午餐后, 晚餐后]
    kb_refs: []
    done_msg: 动起来，就是好的开始。
    partial_msg: 走几分钟也算数。

  - day: 4
    kind: resist
    title: 力量练习第 1 次
    task: 今天做一次很轻的力量练习，大约 10 到 15 分钟：椅子深蹲和靠墙俯卧撑，每个做几次，感觉轻松就行。
    why: 肌肉是身体处理血糖的重要场所之一，力量练习帮助保住和增加肌肉。
    how: 椅子深蹲是坐下再站起；靠墙俯卧撑是面对墙，双手撑墙推起。动作放慢，不憋气，有不舒服就停下。
    note_hypo: *n_hypo
    question:
      text: 今天做了哪些动作？
      key: resist_moves
      options: [椅子深蹲, 靠墙俯卧撑, 两个都做了, 只做了一点]
    kb_refs: []
    done_msg: 第一次最难，你已经做到了。
    partial_msg: 做一点点也算数。

  - day: 5
    kind: diet
    title: 早餐加一份蛋白质
    task: 今天早餐加一份蛋白质：鸡蛋、无糖豆浆、牛奶或豆腐都可以，饭后继续散步一会儿。
    why: 只吃粥、面包、包子这类精制主食的早餐，容易饿，餐后血糖也容易升得快。
    how: 在你平时的早餐上加一样就行，不用换掉原来的。
    note_conservative: *n_med
    question:
      text: 你加的是什么？
      key: breakfast_protein
      options: [鸡蛋, 豆浆或牛奶, 豆腐或豆制品, 其他, 我不吃早餐]
    kb_refs: [KB00-002]
    done_msg: 早餐有蛋白质，上午会更扛饿。
    partial_msg: 加一点点也有帮助。

  - day: 6
    kind: resist
    title: 力量练习第 2 次
    task: 今天做第 2 次很轻的力量练习，仍是大约 10 到 15 分钟：把椅子深蹲和靠墙俯卧撑做一遍，再加一个臀桥。
    why: 每周做两次，肌肉才会慢慢有变化，动作稳比次数更重要。
    how: 臀桥是躺下，膝盖弯曲，慢慢抬起臀部再放下。动作放慢，不憋气，有不舒服就停下。
    note_hypo: *n_hypo
    question:
      text: 今天感觉怎么样？
      key: resist_feel
      options: [轻松, 有点累, 不舒服]
    kb_refs: []
    done_msg: 这一周的两次都做到了，很不错。
    partial_msg: 做一部分也很好，下周接着来。

  - day: 7
    kind: review
    title: 复盘，选一件坚持
    task: 回头看看这一周，选一件你最容易坚持的事，继续做下去，并记下运动之后的感觉。
    why: 能长期坚持的小事，比一次做很多更有用。
    how: 想想这几天哪件事你做起来最顺手，就把它留下来。
    note_conservative: *n_med
    question:
      text: 你最想继续做的是哪一件？
      key: keep_week1
      options: [先吃蔬菜, 餐后散步, 轻量力量练习, 早餐加蛋白质, 都想试试]
    kb_refs: []
    done_msg: 选一件做下去，比什么都想改更容易成功。
    partial_msg: 想好一件就行，不用急。

  # ---------------------------------------------------------------- 第 2 周
  - day: 8
    kind: diet
    title: 饮料换一换
    task: 把今天的一杯含糖饮料，换成白水、淡茶或无糖茶，饭后继续散步一会儿。
    why: 饮料里的糖吸收很快，是比较容易被忽视的血糖波动来源。
    how: 奶茶、果汁、可乐、甜茶饮都算。不用全戒，今天换一杯就够了。
    note_conservative: 如果你正出现心慌、出冷汗等不舒服，请按医生教你的方法处理，今天不用做这个任务。
    question:
      text: 你换掉的是哪一种？
      key: swapped_drink
      options: [奶茶, 果汁, 可乐汽水, 其他甜饮, 我本来就不喝]
    kb_refs: [KB02-002]
    done_msg: 换掉一杯，就已经少了一个血糖波动的来源。
    partial_msg: 先从换掉半杯开始也行。

  - day: 9
    kind: resist
    title: 力量练习第 3 次
    task: 今天做第 3 次力量练习，大约 15 到 20 分钟：前面的动作做一遍，再学一个新动作，弹力带划船。
    why: 时长从短到长慢慢加，身体更容易适应。
    how: 坐着，把弹力带绕在脚上，双手拉带向后，像划船。没有弹力带，今天就把前面的动作多做一轮。
    note_hypo: *n_hypo
    question:
      text: 今天感觉怎么样？
      key: resist_feel
      options: [轻松, 有点累, 不舒服]
    kb_refs: []
    done_msg: 又多会了一个动作。
    partial_msg: 做一部分也很好。

  - day: 10
    kind: diet
    title: 主食搭配一下
    task: 有一餐，把一部分白米饭或白面，换成杂粮、薯类或豆类，份量和平时差不多。
    why: 粗细搭配的主食消化得更慢，饱腹感也更好。
    how: 比如米饭里加一把糙米或红豆，或者用一小块蒸红薯、玉米换掉一部分主食。
    note_conservative: 总量保持和平时差不多，不要因此少吃。
    question:
      text: 你用的是哪一种？
      key: grain_swap
      options: [杂粮饭, 薯类或玉米, 豆类, 没找到合适的]
    kb_refs: [KB00-001, KB00-004, KB02-002]
    done_msg: 粗细搭配，是很容易长期坚持的一种改法。
    partial_msg: 换一小部分就是好的开始。

  - day: 11
    kind: walk
    title: 散步增加到两餐
    task: 今天午餐后和晚餐后各慢走一次，每次大约 10 分钟。
    why: 把活动放在每次吃饭之后，是最容易养成的习惯。
    how: 饭后先休息一会儿再走，慢慢走就行。
    note_hypo: *n_hypo_walk
    question:
      text: 你走了几次？
      key: walk_times
      options: [两次, 一次, 没走成]
    kb_refs: []
    done_msg: 两餐都动起来了。
    partial_msg: 走一次也很好。

  - day: 12
    kind: resist
    title: 力量练习第 4 次
    task: 今天做本周第 2 次力量练习，大约 15 到 20 分钟：已学的动作各做一轮。
    why: 稳定的节奏比一次做很多更重要。
    how: 动作放慢，不憋气，有不舒服就停下。
    note_hypo: *n_hypo
    question:
      text: 今天感觉怎么样？
      key: resist_feel
      options: [轻松, 有点累, 不舒服]
    kb_refs: []
    done_msg: 这一周的两次都做到了。
    partial_msg: 做一部分也很好。

  - day: 13
    kind: diet
    title: 吃饭尽量定时
    task: 今天三餐尽量定时，晚餐不要拖得太晚，也不要省略任何一餐。
    why: 吃饭时间和每餐的量比较稳定，血糖更容易平稳。
    how: 不用精确到分钟，大致固定就行。饿了就吃，不要硬撑。
    note_conservative: 吃药和进餐时间以医嘱为准，不要因为任务改动用药时间，也不要为了“少吃”而省略一餐。
    question:
      text: 你的晚餐大概在几点？
      key: dinner_time_band
      options: [18点前, 18到20点, 20点以后]
    kb_refs: [KB00-009]
    done_msg: 规律是血糖管理里很被低估的一件事。
    partial_msg: 有一两餐准时也是进步。

  - day: 14
    kind: review
    title: 第 2 周复盘
    task: 回看这一周，你的力量练习和散步各做了几天，哪一项最容易做到。
    why: 知道哪件事最顺手，下一步才知道往哪里使劲。
    how: 想一想这一周里，哪一件事你几乎不用提醒就做了。
    note_conservative: *n_med
    question:
      text: 这一周最容易做到的是哪一项？
      key: easiest_week2
      options: [餐后散步, 力量练习, 饮食安排, 都差不多]
    kb_refs: []
    done_msg: 看清楚了，下一周就好安排了。
    partial_msg: 想到多少算多少。

  # ---------------------------------------------------------------- 第 3 周
  - day: 15
    kind: diet
    title: 外食也能选
    task: 今天如果在外面吃，点一份蔬菜或豆制品，主食搭配着吃，饭后散一会儿步。
    why: 外食占了很多人的大部分三餐，学会点餐，比在家里控制更实用。
    how: 点餐时先选一份蔬菜或豆腐类，再选主食和肉蛋。今天没有外食，就按平时的饭后散步做。
    note_conservative: *n_med
    question:
      text: 你点了什么？
      key: eat_out_pick
      options: [蔬菜, 豆制品, 都点了, 今天没在外面吃]
    kb_refs: [KB02-004, KB00-004]
    done_msg: 外面吃也能吃得稳。
    partial_msg: 点一样就是进步。

  - day: 16
    kind: resist
    title: 力量练习第 5 次
    task: 今天做本周第 1 次力量练习，大约 20 到 30 分钟：已学的动作各做一轮。
    why: 时长慢慢增加，身体适应了，再往上加一点。
    how: 动作放慢，不憋气，有不舒服就停下。
    note_hypo: *n_hypo
    question:
      text: 今天感觉怎么样？
      key: resist_feel
      options: [轻松, 有点累, 不舒服]
    kb_refs: []
    done_msg: 本周开了个好头。
    partial_msg: 做一部分也很好。

  - day: 17
    kind: walk
    title: 不方便时的替代
    task: 雨天或太晚时，不出门也能动：在室内走动或站立活动几分钟。
    why: 找到替代方案，习惯就不容易被打断。
    how: 饭后在家里来回走几分钟，或者站着做一会儿家务。
    note_hypo: *n_hypo_walk
    question:
      text: 你用的是哪一种方式？
      key: indoor_move
      options: [室内走动, 站着做家务, 原本就出门散步了, 没动成]
    kb_refs: []
    done_msg: 不出门也能动，很好。
    partial_msg: 动几分钟也算数。

  - day: 18
    kind: aware
    title: 饮酒觉察
    task: 今天记一下：有没有喝酒？喝了几杯？不评判，也不要求戒酒。
    why: 知道自己喝了多少，之后和医生聊起来才更具体。
    how: 回想今天是否喝过酒，选一个最接近的。具体能不能喝、喝多少，听医生的。
    note_conservative: 饮酒和降糖药一起用需要注意，具体听医生的。
    question:
      text: 今天的饮酒情况？
      key: alcohol_today
      options: [没喝, 1杯以内, 2到3杯, 更多]
    kb_refs: []
    done_msg: 看清楚就是第一步。
    partial_msg: 想起来多少记多少。

  - day: 19
    kind: resist
    title: 力量练习第 6 次
    task: 今天做本周第 2 次力量练习，大约 20 到 30 分钟：选一个动作稍微加一点难度，比如多做几次，或者放得更慢。
    why: 加一点点难度，肌肉才会继续有进步。
    how: 只加一个动作的难度，其他保持不变，有不舒服就停下。
    note_hypo: *n_hypo
    question:
      text: 今天感觉怎么样？
      key: resist_feel
      options: [轻松, 有点累, 不舒服]
    kb_refs: []
    done_msg: 又往前走了一步。
    partial_msg: 做一部分也很好。

  - day: 20
    kind: aware
    title: 作息觉察
    task: 今天记一下：大约几点睡觉，几点吃饭，看看生活是否规律。
    why: 睡眠和进餐的节奏，会影响第二天的状态和食欲。
    how: 睡前想一想今天的睡觉和吃饭时间，选一个最接近的。
    note_conservative: *n_med
    question:
      text: 今天大概几点睡？
      key: bedtime_band
      options: [22点前, 22到24点, 24点以后]
    kb_refs: [KB00-009]
    done_msg: 知道自己的节奏，就有办法调整。
