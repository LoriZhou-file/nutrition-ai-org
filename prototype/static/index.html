<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30 天控糖小管理</title>
<style>
:root{--bg:#f6f8f6;--card:#fff;--ink:#1c2a22;--sub:#5d6b63;--line:#dde5df;--brand:#2f7d5b;--brand-ink:#fff;--soft:#e8f3ec;--warn:#8a5a00;--warn-bg:#fff4dc;--red:#a12f2f;--red-bg:#fdeaea;--half:#e0a93b}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--ink:#e8efe9;--sub:#a3b1a9;--line:#2c3a33;--brand:#58b88a;--brand-ink:#0d1a13;--soft:#1f3328;--warn:#f0c46a;--warn-bg:#352a10;--red:#f19a9a;--red-bg:#3a1c1c;--half:#e0b25a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
header{padding:14px 0 8px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:600}.brand small{color:var(--sub);font-weight:400;margin-left:6px}
.demo{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:10px}
section{display:none}section.on{display:block}
h1{font-size:26px;line-height:1.3;margin:14px 0 6px;font-weight:600}
h2{font-size:18px;margin:6px 0;font-weight:600}
.sub{color:var(--sub);font-size:15px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.feat{display:flex;gap:12px;align-items:flex-start;padding:10px 0}.feat+.feat{border-top:1px solid var(--line)}
.feat b{display:block}.feat span{color:var(--sub);font-size:14px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.btn{display:block;width:100%;background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.soft{background:var(--soft);color:var(--brand)}
.btn:disabled{opacity:.5}
.linkbtn{background:none;border:0;color:var(--sub);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 0}
.yn{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}.yn:first-of-type{border-top:0}
.seg{display:flex;gap:6px;flex:none}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 14px;font:inherit;font-size:14px}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{border-color:var(--brand);color:var(--brand);background:var(--soft)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}.chk input{margin-top:5px}
.err{color:var(--red);font-size:13px;min-height:1px;margin-top:6px}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px 2px;margin:4px 0 12px}
.dot{text-align:center;font-size:11px;color:var(--sub);background:none;border:0;padding:0;cursor:pointer;font:inherit}
.dot i{display:block;width:100%;aspect-ratio:1;max-width:26px;margin:0 auto 1px;border-radius:50%;border:2px solid var(--line);background:var(--card);position:relative}
.dot.done i{background:var(--brand);border-color:var(--brand)}
.dot.partial i{background:linear-gradient(90deg,var(--half) 50%,var(--card) 50%);border-color:var(--half)}
.dot.skipped i{border-style:dashed;border-color:var(--sub)}
.dot.locked{opacity:.4;cursor:default}
.dot.cur i{box-shadow:0 0 0 3px var(--soft);border-color:var(--brand)}
.dot.sel{color:var(--ink);font-weight:600}
.tag{display:inline-block;font-size:12px;background:var(--soft);color:var(--brand);border-radius:6px;padding:1px 8px}
.task{font-size:20px;line-height:1.5;font-weight:600;margin:8px 0 10px}
.kv{font-size:14px;color:var(--sub);margin:6px 0}.kv b{color:var(--ink);font-weight:600}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:14px;margin-top:10px}
.stop{background:var(--red-bg);color:var(--red);border-radius:14px;padding:16px}
.fb{background:var(--soft);border-radius:14px;padding:14px;margin-bottom:12px}
.fb p{margin:0 0 6px}.fb p:last-child{margin:0}
.small{font-size:12px;color:var(--sub)}
input.t,textarea.t{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.sumline{margin:6px 0}
.wk{border-left:3px solid var(--brand)}
.foot{margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">SeekNutri<small>控糖助手</small></div><span class="small" id="eng"></span></header>
<div class="demo">雏形演示：任务内容尚未经营养师审核，请勿对外使用。</div>

<!-- 开场 -->
<section id="s_intro" class="on">
  <h1>30 天控糖小管理</h1>
  <p class="sub">每天只做一件小事，不用节食，不用记数字。每天大约 1 分钟，每周给你一个小结。</p>
  <div class="card">
    <div class="feat"><div class="num">1</div><div><b>每天一个小任务</b><span>先吃蔬菜、饭后散步、轻量力量练习……都是生活里顺手能做的事</span></div></div>
    <div class="feat"><div class="num">2</div><div><b>点一下就能打卡</b><span>做到了、做了一部分、没做到，不用写文字，不用拍照</span></div></div>
    <div class="feat"><div class="num">3</div><div><b>每周一个小结，30 天一个总结</b><span>看看哪件事最适合你，想继续的话可以让营养师带你</span></div></div>
  </div>
  <button class="btn" id="b_start">开始</button>
  <p class="small" style="text-align:center;margin-top:10px">我是 AI 营养助手，不是医生或营养师，不涉及药物调整。</p>
</section>

<!-- 安全确认 -->
<section id="s_gate">
  <h2>开始前，30 秒确认</h2>
  <p class="sub">为了安全，有些情况需要由医生或营养师当面指导。</p>
  <div class="card" id="gateList"></div>
  <div class="card">
    <b style="font-size:15px">目前是否在使用降糖药物？</b>
    <div class="chips" id="drugChips"></div>
  </div>
  <div class="card"><label class="chk"><input type="checkbox" id="consent"><span>我同意提供健康相关信息，用于生成每日任务和小结。不需要姓名和手机号，可以随时删除。</span></label></div>
  <div class="err" id="e_gate"></div>
  <button class="btn" id="b_go">开始挑战</button>
</section>

<!-- 一次性提示 -->
<section id="s_notice">
  <h2 id="ntTitle"></h2>
  <div class="card"><p id="ntText" style="margin:0"></p></div>
  <button class="btn" id="b_ack">我已了解</button>
</section>

<!-- 主页 -->
<section id="s_home">
  <div class="dots" id="dots"></div>
  <div class="card" id="taskCard"></div>
  <div id="after"></div>
  <div class="foot">
    <p class="small" id="footer"></p>
    <button class="linkbtn" id="b_demo" style="display:none">演示：模拟到下一天</button>
    <button class="linkbtn" id="b_del">删除我的全部数据</button>
  </div>
</section>

<!-- 暂停 -->
<section id="s_stop">
  <div class="stop" id="stopMsg"></div>
  <p class="small" style="margin-top:12px">本工具不能替代医生。</p>
  <div class="foot"><button class="linkbtn" id="b_del2">删除我的全部数据</button></div>
</section>

<!-- 不符合条件 -->
<section id="s_ref"><div class="stop" id="refMsg"></div></section>
</div>

<script>
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;};
const SID_KEY='sn_challenge_sid';
let SID=null; try{SID=localStorage.getItem(SID_KEY);}catch(e){}
const NEW_SID=()=> (crypto.randomUUID?crypto.randomUUID():'00000000-0000-4000-8000-'+Date.now().toString().padStart(12,'0').slice(-12));
let ST=null, SEL=null, SCREEN={}, DRUG=null, FB={};
const DEMO=new URLSearchParams(location.search).get('demo')==='1';

function show(id){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id)); window.scrollTo(0,0);}
async function api(path,body,method){
  const r=await fetch(path,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  let j=null; try{j=await r.json();}catch(e){}
  if(!r.ok){const err=new Error((j&&j.detail)||'请求失败'); err.status=r.status; throw err;}
  return j;
}
fetch('/api/health').then(r=>r.json()).then(h=>{$('eng').textContent=h.engine==='mock'?'演示模式':'模型：'+h.engine;}).catch(()=>{});

// ---- 开场 → 安全确认
$('b_start').onclick=()=>show('s_gate');
const Q=[['adult','我已满 18 岁',true],['pregnant_or_lactating','我目前处于孕期或哺乳期',false],['type1_diabetes','我是 1 型糖尿病',false],['severe_kidney_or_eating_disorder','我有严重肾病，或有进食障碍（如催吐、暴食）',false]];
Q.forEach(([k,q])=>{const row=el('div','yn'); row.appendChild(el('span',null,q)); const seg=el('div','seg');
  [['是',true],['否',false]].forEach(([t,v])=>{const b=el('button',null,t); b.type='button'; b.onclick=()=>{SCREEN[k]=v;[...seg.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');}; seg.appendChild(b);});
  row.appendChild(seg); $('gateList').appendChild(row);});
[['没有使用','no'],['口服药','oral'],['胰岛素','insulin'],['口服药和胰岛素','oral_and_insulin'],['不确定','unsure']].forEach(([l,v])=>{
  const c=el('button','chip',l); c.type='button'; c.onclick=()=>{DRUG=v;[...$('drugChips').children].forEach(x=>x.classList.remove('on'));c.classList.add('on');}; $('drugChips').appendChild(c);});
let CFG=null, NOTICES=[];
fetch('/api/challenge/config').then(r=>r.json()).then(c=>{CFG=c;}).catch(()=>{});
function nextNotice(){
  const n=NOTICES.shift(); if(!n) return startNow();
  $('ntTitle').textContent=n.title; $('ntText').textContent=n.text; $('b_ack').textContent=n.ack||'我已了解'; show('s_notice');
}
$('b_ack').onclick=nextNotice;
$('b_go').onclick=()=>{
  if(Q.some(([k])=>SCREEN[k]===undefined)||!DRUG){$('e_gate').textContent='请逐项选择';return;}
  if(!$('consent').checked){$('e_gate').textContent='需要先勾选同意才能继续';return;}
  $('e_gate').textContent='';
  NOTICES=[];
  if(CFG&&CFG.notices){
    if(DRUG!=='no') NOTICES.push(CFG.notices.hypo);
    if(SCREEN.pregnant_or_lactating||SCREEN.type1_diabetes||SCREEN.severe_kidney_or_eating_disorder) NOTICES.push(CFG.notices.special);
  }
  nextNotice();
};
async function startNow(){
  $('b_go').disabled=true;
  try{
    SID=SID||NEW_SID();
    ST=await api('/api/challenge/start',{session_id:SID,consent:true,screening:SCREEN,uses_glucose_lowering_drug:DRUG,source:new URLSearchParams(location.search).get('src')||'challenge'});
    try{localStorage.setItem(SID_KEY,SID);}catch(e){}
    SEL=null; render();
  }catch(e){ if(e.status===403){$('refMsg').textContent=e.message; show('s_ref');} else {$('e_gate').textContent=e.message; show('s_gate');} }
  finally{$('b_go').disabled=false;}
}

// ---- 主页
function render(){
  if(ST.blocked){ $('stopMsg').replaceChildren(); (ST.stop_messages||[]).forEach(m=>$('stopMsg').appendChild(el('p',null,m))); show('s_stop'); return; }
  const day=SEL||ST.current_day; SEL=day;
  const dots=$('dots'); dots.replaceChildren();
  ST.days.forEach(d=>{const b=el('button','dot '+(d.status||'')+(d.unlocked?'':' locked')+(d.day===ST.current_day?' cur':'')+(d.day===day?' sel':'')); b.type='button';
    b.appendChild(el('i')); b.appendChild(document.createTextNode(String(d.day))); if(d.unlocked) b.onclick=()=>{SEL=d.day; FB={}; render();}; dots.appendChild(b);});
  const t=ST.tasks[day], ck=ST.checkins[day], card=$('taskCard'); card.replaceChildren(); $('after').replaceChildren();
  const head=el('div'); head.appendChild(el('span','tag',day===ST.current_day?'今天的小任务':'第 '+day+' 天的任务')); head.appendChild(el('span','small','  '+t.title)); card.appendChild(head);
  card.appendChild(el('div','task',t.task));
  const why=el('div','kv'); why.appendChild(el('b',null,'为什么：')); why.appendChild(document.createTextNode(t.why)); card.appendChild(why);
  const how=el('div','kv'); how.appendChild(el('b',null,'怎么做：')); how.appendChild(document.createTextNode(t.how)); card.appendChild(how);
  if(t.note) card.appendChild(el('div','note',t.note));
  if(ck){ renderDone(card,t,ck,day); }
  else renderButtons(card,t,day);
  $('footer').textContent=ST.footer;
  $('b_demo').style.display=(DEMO&&ST.demo&&ST.current_day<ST.days_total)?'inline-block':'none';
  renderWeekly(day);
  if(ST.summary && day===ST.days_total && ST.checkins[ST.days_total]) renderSummary();
  show('s_home');
}

function renderButtons(card,t,day){
  const box=el('div'); box.style.marginTop='12px'; card.appendChild(box);
  const mk=(label,status,cls)=>{const b=el('button','btn '+cls,label); b.type='button'; b.onclick=()=>pick(box,t,day,status); return b;};
  box.appendChild(mk(ST.statuses.done,'done','')); box.appendChild(mk(ST.statuses.partial,'partial','soft')); box.appendChild(mk(ST.statuses.skipped,'skipped','ghost'));
}
function pick(box,t,day,status){
  box.replaceChildren();
  if(status==='skipped'){
    box.appendChild(el('p','kv','是什么让你今天没做到？（可以跳过）'));
    const ch=el('div','chips'); ST.barriers.forEach(b=>{const c=el('button','chip',b.label); c.type='button'; c.onclick=()=>submit(day,status,{barrier:b.id}); ch.appendChild(c);}); box.appendChild(ch);
    const skip=el('button','linkbtn','跳过'); skip.onclick=()=>submit(day,status,{}); box.appendChild(skip);
  }else if(t.question){
    box.appendChild(el('p','kv',t.question.text+'（可以跳过）'));
    const ch=el('div','chips'); t.question.options.forEach(o=>{const c=el('button','chip',o); c.type='button'; c.onclick=()=>submit(day,status,{answer:o}); ch.appendChild(c);}); box.appendChild(ch);
    const skip=el('button','linkbtn','跳过'); skip.onclick=()=>submit(day,status,{}); box.appendChild(skip);
  }else submit(day,status,{});
}
async function submit(day,status,extra){
  try{
    const r=await api('/api/challenge/'+SID+'/checkin',{day,status,...extra});
    if(r.stop){ ST=r.state; render(); return; }
    FB[day]={feedback:r.feedback,ai:r.ai_reply,notices:r.notices}; ST=r.state; render();
  }catch(e){ alert(e.message); }
}
function renderDone(card,t,ck,day){
  const lab={done:'做到了',partial:'做了一部分',skipped:'没做到'}[ck.status];
  const row=el('div','kv'); row.style.marginTop='12px'; row.appendChild(el('b',null,'已打卡：')); row.appendChild(document.createTextNode(lab+(ck.answer?' · '+ck.answer:'')));
  card.appendChild(row);
  const a=$('after'), f=FB[day];
  if(f){const box=el('div','fb'); f.notices.forEach(n=>box.appendChild(el('p','small',n))); box.appendChild(el('p',null,f.feedback)); if(f.ai) box.appendChild(el('p',null,f.ai)); a.appendChild(box);}
  if(day===ST.current_day && day<ST.days_total){
    const nxt=el('div','card'); nxt.appendChild(el('b',null,'明天见')); nxt.appendChild(el('div','small','明天的小任务：「'+ST.days[day].title+'」。不用急，做完今天的就够了。')); a.appendChild(nxt);
  }
  if(!ck.note){
    const wrap=el('div'); const open=el('button','linkbtn','想补充一句？比如哪里不舒服、遇到什么情况'); wrap.appendChild(open);
    open.onclick=()=>{wrap.replaceChildren(); const i=el('input','t'); i.type='text'; i.maxLength=200; i.placeholder='写一句就行'; wrap.appendChild(i);
      const s=el('button','btn soft','发送'); s.type='button'; s.onclick=async()=>{ if(!i.value.trim())return; s.disabled=true;
        try{const r=await api('/api/challenge/'+SID+'/checkin',{day,status:ck.status,barrier:ck.barrier,answer:ck.answer,note:i.value.trim()});
          if(r.stop){ST=r.state;render();return;} FB[day]={feedback:FB[day]?FB[day].feedback:r.feedback,ai:r.ai_reply,notices:r.notices}; ST=r.state; render();}catch(e){alert(e.message);s.disabled=false;}}; wrap.appendChild(s);};
    a.appendChild(wrap);
  }
}

// ---- 每周小结
function renderWeekly(day){
  const w=(ST.weekly||[]).find(x=>day>=x.days[0]&&day<=x.days[1]&&day===x.days[1]);
  if(!w) return;
  const box=el('div','card wk'); box.appendChild(el('h2',null,'第 '+w.week+' 周小结'));
  w.lines.forEach(l=>box.appendChild(el('p','sumline',l)));
  $('after').appendChild(box);
}

// ---- 30 天总结
function renderSummary(){
  const s=ST.summary, a=$('after'); const box=el('div','card'); box.appendChild(el('h2',null,s.title));
  s.lines.forEach(l=>box.appendChild(el('p','sumline',l)));
  box.appendChild(el('hr')); box.lastChild.style.cssText='border:0;border-top:1px solid var(--line);margin:12px 0';
  if(ST.confirmed){ box.appendChild(el('p',null,ST.interest.coaching_interest?'已记录你的意向，营养师团队方案准备好后会通知你。':'已保存你的小结。')); }
  else{
    box.appendChild(el('p','kv',s.invite));
    const lab=el('label','chk'); const cb=el('input'); cb.type='checkbox'; lab.appendChild(cb); lab.appendChild(el('span',null,'我想了解有营养师带着我继续做')); box.appendChild(lab);
    const note=el('input','t'); note.type='text'; note.placeholder='你最希望得到什么帮助？（可选）'; box.appendChild(note);
    const ok=el('button','btn','保存我的小结'); ok.type='button'; ok.onclick=async()=>{ok.disabled=true;
      try{ST=await api('/api/challenge/'+SID+'/interest',{coaching_interest:cb.checked,notes:note.value}); render();}catch(e){alert(e.message);ok.disabled=false;}}; box.appendChild(ok);
  }
  a.appendChild(box);
}

// ---- 其他
$('b_demo').onclick=async()=>{ try{ST=await api('/api/challenge/'+SID+'/advance',{}); SEL=null; FB={}; render();}catch(e){alert(e.message);} };
async function del(){ if(!confirm('确定删除你的全部数据吗？删除后不能恢复。'))return;
  try{await api('/api/session/'+SID,null,'DELETE'); try{localStorage.removeItem(SID_KEY);}catch(e){} SID=null; ST=null; SEL=null; FB={}; location.reload();}catch(e){alert(e.message);} }
$('b_del').onclick=del; $('b_del2').onclick=del;

// ---- 回访：有记录就直接进主页
(async()=>{ if(!SID) return;
  try{ST=await api('/api/challenge/'+SID); render();}catch(e){ if(e.status===404){ try{localStorage.removeItem(SID_KEY);}catch(x){} SID=null; } } })();
</script>
</body>
</html>
