# 演示用关键词（非审定）
#
# 仅供雏形演示。上线前必须由营养师与医疗顾问审定并替换，
# 对应 knowledge/KB-07_风险识别与医疗转介/rules/risk_rules.yaml 中的 TODO_CLINICAL。
# 关键词匹配只是兜底的第一道网，不能替代审定后的规则。

R-EMG:
  any: [胸痛, 胸口痛, 胸闷, 喘不上气, 呼吸困难, 昏迷, 意识不清, 晕倒, 抽搐, 说不出话]

R-HYPO:
  strong: [心慌, 出冷汗, 冷汗, 手抖, 发抖]
  weak: [头晕, 乏力, 饥饿难忍, 眼前发黑]
  # 强信号 1 个且在用药，或强弱信号合计 2 个及以上，触发
  min_total: 2
  min_strong_if_medicated: 1

R-HYPER:
  all_groups:
    - [口渴, 多尿, 尿多, 喝水多]
    - [恶心, 呕吐, 呼吸急促, 意识模糊]

R-MED:
  any: [停药, 减药, 不吃药, 少吃一片, 少打, 减量, 加量, 调药, 药量, 剂量, 不打胰岛素, 停胰岛素, 自己调]

R-EXTREME:
  any: [晚饭也不吃, 不吃晚饭, 不吃晚餐, 禁食, 断食, 绝食, 只吃黄瓜, 只吃水果, 只吃苹果, 再少吃, 三天不吃, 一天只吃一顿]

R-DX:
  any: [是不是糖尿病, 是否患有糖尿病, 帮我诊断, 我是不是得了, 判断我是不是]

R-ED:
  any: [催吐, 抠喉, 吃完就吐, 暴食后, 厌食]

R-RAPID:
  any: [暴瘦, 不明原因, 体重骤降, 突然瘦了, 瘦得很快]
